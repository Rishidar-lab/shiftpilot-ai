# Render Blueprint — ShiftPilot Week-1 demonstration deployment.
#
# One free web service running the repository's Dockerfile: a single Node
# process serving the built React app at / and the Fastify API at /api/*.
#
# Storage is deliberately EPHEMERAL. The free instance type has no disk, so the
# SQLite database lives in the container's writable layer and starts empty
# whenever the service is redeployed, restarted, or resumed after a spin-down.
# That is an accepted Week-1 trade-off for a demonstration environment, not an
# oversight — migrations run on every boot, so an empty database is a working
# database. Attaching a disk at the same DATABASE_PATH makes it durable later
# with no change to the image or the application.
#
# No secret value appears in this file. OPENROUTER_API_KEY is marked sync:false,
# so Render prompts for it once and stores it in its own secret store.

services:
  - type: web
    name: shiftpilot
    runtime: docker # older Render schemas call this key `env`
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      # PORT is injected by Render and must not be pinned here.
      #
      # /tmp, not /data: on the free instance type nothing is mounted, so a
      # path named /data would read as a persistent volume that does not exist.
      # /tmp says what this is — scratch space that starts empty after any
      # lifecycle event. A durable deployment sets DATABASE_PATH=/data and
      # mounts a disk there; the image and the application are unchanged.
      - key: DATABASE_PATH
        value: /tmp/shiftpilot.db
      - key: AI_PROVIDER
        value: openrouter
      # Free route only. assertFreeOpenRouterModel rejects anything else at
      # boot and before every inference; there is no paid fallback.
      #
      # PINNED, not the `openrouter/free` auto-router. The auto-router is free
      # but picks the model per request, and a reasoning model that spends the
      # whole output budget on hidden reasoning returns an empty completion —
      # observed live as a 502 ai_invalid_response. A pinned non-reasoning model
      # makes the demo path reproducible.
      - key: OPENROUTER_MODEL
        value: google/gemma-4-26b-a4b-it:free
      # Deliberately 0, and this is the opposite of the obvious choice.
      #
      # Retries do not extend the budget, they SUBDIVIDE it: the provider gives
      # each attempt total/(retries+1). Measured on this exact demo workload,
      # the free gemma route answers in 42s / 54s / 129s — so three starved
      # 31s attempts fail every time, while one full-budget attempt succeeds in
      # the normal case. A 429 therefore fails fast and honestly, and the human
      # retries with the button the UI already gives them, rather than the
      # server burning the whole budget on attempts too short to ever finish.
      - key: OPENROUTER_MAX_RETRIES
        value: "0"
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      # Output ceiling. The canonical demo workload is 11 lines, and 11 extracted
      # tasks of JSON land right at the 1024-token default — a truncated object
      # is unparseable and surfaces as a failed extraction. 2048 clears it with
      # room to spare and still costs nothing on a free route.
      - key: OPENROUTER_MAX_OUTPUT_TOKENS
        value: "2048"
      # Total wall-clock budget for one inference, enforced by the API
      # (withTimeout) on top of the provider's own per-attempt deadline.
      #
      # Sized against two real ceilings. Below: the free route needs 42-129s
      # (measured) to extract the full 11-line demo workload. Above: Cloudflare
      # fronts Render and cuts off an origin response at ~100s, so no setting
      # can rescue the slowest tail — 95s buys every second actually available
      # before the platform, not the application, ends the request.
      - key: AI_TIMEOUT_MS
        value: "95000"
      # Entered in the Render dashboard, never committed. Use a NEW rotated key.
      - key: OPENROUTER_API_KEY
        sync: false
    # CORS_ORIGIN is intentionally absent: the browser app and the API are the
    # same origin, so no cross-origin request is ever made and no CORS policy is
    # load-bearing. Set it only if the frontend is later served elsewhere.
